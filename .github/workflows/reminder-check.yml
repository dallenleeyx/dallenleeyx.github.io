name: Autonomous reminder check

# Vercel's Hobby plan caps cron jobs at once/day, too coarse for "a few
# times a day" -- this workflow hits the same secured endpoint on a
# schedule instead, mirroring dallen_notes' own polling Action.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder-check endpoint
        run: |
          curl -sf -X GET "${{ vars.SITE_BASE_URL }}/api/cron/reminder-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
