<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music — Dallen Lee</title>
  <meta name="description" content="Recordings, arrangements, and music projects by Dallen Lee.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../assets/music.css">
</head>
<body>
  <div class="music-shell">
    <a class="skip-link" href="#projects">Skip to music projects</a>
    <header class="music-nav">
      <a class="wordmark" href="../../">Dallen Lee</a>
      <nav aria-label="Main navigation">
        <a href="../../">Home</a>
        <a href="./" aria-current="page">Music</a>
        <a href="../../notes/">Notes &amp; simulations</a>
      </nav>
    </header>
    <main>
      <header class="music-intro">
        <p class="eyebrow">Outside mathematics</p>
        <h1>Music</h1>
        <p>Things I've played, recorded, arranged, or made. A small collection, added to as it grows.</p>
      </header>
      <section aria-label="Recordings and projects">
        <div class="section-heading"><h2>Selected work</h2><span>Recordings &amp; projects</span></div>
        <ol class="project-list" id="projects"><!-- projects:start -->
        <li class="empty-projects">No recordings posted yet.</li>
        <!-- projects:end --></ol>
      </section>
    </main>
    <footer class="music-footer"><span>© Dallen Lee</span><a href="https://app.pagescms.org/dallenleeyx/dallenleeyx.github.io/main" rel="noopener noreferrer" target="_blank">Manage music ↗</a></footer>
  </div>
  <dialog id="audioDialog" aria-labelledby="audioTitle">
    <div class="dialog-heading"><h2 id="audioTitle">Listen</h2><button type="button" class="close-player" aria-label="Close player">×</button></div>
    <div id="audioPlayer"></div><p id="audioCredit"></p>
  </dialog>
  <script>
    (() => {
      const dialog = document.querySelector('#audioDialog');
      const player = document.querySelector('#audioPlayer');
      const title = document.querySelector('#audioTitle');
      const credit = document.querySelector('#audioCredit');
      document.querySelectorAll('.listen-button[data-audio]').forEach(button => {
        button.hidden = false;
        button.addEventListener('click', () => {
          const url = button.dataset.audio;
          if (!/^https:\/\/(www\.)?soundcloud\.com\//.test(url)) return;
          title.textContent = button.dataset.title || 'Listen';
          credit.textContent = button.dataset.credit || '';
          const frame = document.createElement('iframe');
          frame.src = 'https://w.soundcloud.com/player/?url=' + encodeURIComponent(url) + '&auto_play=false';
          frame.title = title.textContent;
          frame.loading = 'lazy';
          frame.allow = 'autoplay';
          player.replaceChildren(frame);
          dialog.showModal();
        });
      });
      dialog.querySelector('.close-player').addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => player.replaceChildren());
      dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
    })();
  </script>
</body>
</html>
